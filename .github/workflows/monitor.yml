name: Pantau posisi & perintah Telegram
on:
  schedule:
    - cron: "*/15 2-8 * * 1-5"  # tiap 15 menit, 09:00-15:45 WIB (jam bursa)
    - cron: "0 13-23/2 * * *"   # malam: baca perintah /beli /jual (20:00, 22:00, ... WIB)
    - cron: "0 1 * * *"         # 08:00 WIB sebelum bursa buka
  workflow_dispatch:

permissions:
  contents: write
concurrency: portfolio

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python bot/monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Simpan data
        run: |
          git config user.name "sinyal-bot"
          git config user.email "sinyal-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "pantau $(date -u +%FT%H%M)" && git pull --rebase && git push)
